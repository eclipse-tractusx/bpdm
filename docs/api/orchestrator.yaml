components:
  schemas:
    AdditionalSiteV7Dto:
      type: object
      description: "A further site an address belongs to. It carries only what identifies\
        \ the site, because it is never the subject of the business partner data it\
        \ appears in: the address it belongs to is the one stated by the surrounding\
        \ business partner data."
      properties:
        bpnReference:
          $ref: "#/components/schemas/BpnReferenceV7Dto"
        siteName:
          type:
            - string
            - "null"
    AddressGoldenRecordRelationV7Dto:
      type: object
      description: "A golden record relation between addresses, pointing from a source\
        \ BPNA to a target BPNA"
      properties:
        relationType:
          type: string
          enum:
            - IsReplacedBy
        sourceBpn:
          type: string
        targetBpn:
          type: string
    AlternativeAddressScriptVariantV7Dto:
      type: object
      properties:
        city:
          type:
            - string
            - "null"
    AlternativeAddressV6Dto:
      type: object
      description: An alternative postal address describes an alternative way of delivery
        for example if the goods are to be picked up somewhere else.
      properties:
        geographicCoordinates:
          $ref: "#/components/schemas/GeoCoordinateV6Dto"
        country:
          type:
            - string
            - "null"
        administrativeAreaLevel1:
          type:
            - string
            - "null"
        postalCode:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        deliveryServiceType:
          type:
            - string
            - "null"
          enum:
            - PO_BOX
            - PRIVATE_BAG
            - BOITE_POSTALE
        deliveryServiceQualifier:
          type:
            - string
            - "null"
        deliveryServiceNumber:
          type:
            - string
            - "null"
    AlternativeAddressV7Dto:
      type: object
      description: An alternative postal address describes an alternative way of delivery
        for example if the goods are to be picked up somewhere else.
      properties:
        geographicCoordinates:
          $ref: "#/components/schemas/GeoCoordinateV7Dto"
        country:
          type:
            - string
            - "null"
        administrativeAreaLevel1:
          type:
            - string
            - "null"
        postalCode:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        deliveryServiceType:
          type:
            - string
            - "null"
          enum:
            - PO_BOX
            - PRIVATE_BAG
            - BOITE_POSTALE
        deliveryServiceQualifier:
          type:
            - string
            - "null"
        deliveryServiceNumber:
          type:
            - string
            - "null"
    BpnReferenceV6Dto:
      type: object
      description: A reference to a BPN for the corresponding business partner data.
        Either this reference contains an existing BPN or a BPN request identifier.
        The golden record process makes sure that the each unique BPN request identifier
        is associated to a unique BPN. For a new BPN request identifier the golden
        record process creates a new BPN (and golden record) and associates it with
        the BPN request identifier. Known BPN request identifiers are resolved to
        the BPN and the corresponding golden record is updated with the business partner
        data. This makes it possible for duplication check services to reference unique
        business partners by their own BPN request identifiers instead of needing
        to rely on BPNs for identification.
      properties:
        referenceValue:
          type:
            - string
            - "null"
        desiredBpn:
          type:
            - string
            - "null"
        referenceType:
          type:
            - string
            - "null"
          enum:
            - Bpn
            - BpnRequestIdentifier
    BpnReferenceV7Dto:
      type: object
      description: A reference to a BPN for the corresponding business partner data.
        Either this reference contains an existing BPN or a BPN request identifier.
        The golden record process makes sure that the each unique BPN request identifier
        is associated to a unique BPN. For a new BPN request identifier the golden
        record process creates a new BPN (and golden record) and associates it with
        the BPN request identifier. Known BPN request identifiers are resolved to
        the BPN and the corresponding golden record is updated with the business partner
        data. This makes it possible for duplication check services to reference unique
        business partners by their own BPN request identifiers instead of needing
        to rely on BPNs for identification.
      properties:
        referenceValue:
          type:
            - string
            - "null"
        desiredBpn:
          type:
            - string
            - "null"
        referenceType:
          type:
            - string
            - "null"
          enum:
            - Bpn
            - BpnRequestIdentifier
    BusinessPartnerRelationsV7Dto:
      type: object
      description: 'The business partner relations data to be processed '
      properties:
        relationType:
          type: string
          enum:
            - IsAlternativeHeadquarterFor
            - IsManagedBy
            - IsOwnedBy
            - IsReplacedBy
        businessPartnerSourceBpn:
          type: string
        businessPartnerTargetBpn:
          type: string
        validityPeriods:
          type: array
          items:
            $ref: "#/components/schemas/RelationValidityPeriodV7Dto"
        reasonCode:
          type:
            - string
            - "null"
    BusinessPartnerV6Dto:
      type: object
      description: "Generic business partner data for golden record processing. Typically\
        \ a sharing member shares incomplete and/or uncategorized business partner\
        \ data to the golden record process. The golden record process categorizes\
        \ and completes the data in order to create and update the resulting golden\
        \ records. The golden records are found in the legalEntity, site and additionalAddress\
        \ fields. The business partner data needs to contain the full golden record\
        \ parent relationship. This means, if an additional address is specified in\
        \ the business partner data, also its legal entity and also its site parent\
        \ (if a site exists) needs to be specified. "
      properties:
        nameParts:
          type: array
          items:
            $ref: "#/components/schemas/NamePartV6Dto"
        owningCompany:
          type:
            - string
            - "null"
        uncategorized:
          $ref: "#/components/schemas/UncategorizedPropertiesV6Dto"
        legalEntity:
          $ref: "#/components/schemas/LegalEntityV6Dto"
        site:
          oneOf:
            - $ref: "#/components/schemas/SiteV6Dto"
            - type: "null"
        additionalAddress:
          oneOf:
            - $ref: "#/components/schemas/PostalAddressV6Dto"
            - type: "null"
        type:
          type:
            - string
            - "null"
          description: |-
            The recognized golden record type this business partner data contains.
            * `Legal Entity`: The business partner data only contains legal entity and legal address information.
            * `Site`: The business partner data contains site, site main address and its parent legal entity information.
            * `Additional Address`: The business partner data contains an additional address, (optional) parent site and parent legal entity information.
            * `Null`: No clear type determined, undecided. The golden record process will not create golden record from this business partner data.
          enum:
            - LegalEntity
            - Site
            - Address
    BusinessPartnerV7Dto:
      type: object
      description: "Generic business partner data for golden record processing. Typically\
        \ a sharing member shares incomplete and/or uncategorized business partner\
        \ data to the golden record process. The golden record process categorizes\
        \ and completes the data in order to create and update the resulting golden\
        \ records. The golden records are found in the legalEntity, site and additionalAddress\
        \ fields. The business partner data needs to contain the full golden record\
        \ parent relationship. This means, if an additional address is specified in\
        \ the business partner data, also its legal entity and also its site parent\
        \ (if a site exists) needs to be specified. "
      properties:
        nameParts:
          type: array
          items:
            $ref: "#/components/schemas/NamePartV7Dto"
        owningCompany:
          type:
            - string
            - "null"
        uncategorized:
          $ref: "#/components/schemas/UncategorizedPropertiesV7Dto"
        legalEntity:
          $ref: "#/components/schemas/LegalEntityV7Dto"
        site:
          oneOf:
            - $ref: "#/components/schemas/SiteV7Dto"
            - type: "null"
        additionalAddress:
          oneOf:
            - $ref: "#/components/schemas/PostalAddressWithScriptVariantsV7Dto"
            - type: "null"
        additionalSites:
          type: array
          description: "The further sites the address of this business partner data\
            \ belongs to, next to the site in 'site'. Together with 'site' this states\
            \ the address's complete site membership: a site the address currently\
            \ belongs to but this field leaves out is unlinked from it. Consolidating\
            \ the records that share an address into that complete list is the golden\
            \ record process's responsibility, not the Pool's. An entry that resolves\
            \ to an existing site links that site to the address; an entry that does\
            \ not resolve creates a new site with this address as its main address.\
            \ An already existing site is never updated through this field. A site\
            \ the address is the main address of cannot be unlinked and has to be\
            \ stated."
          items:
            $ref: "#/components/schemas/AdditionalSiteV7Dto"
        type:
          type:
            - string
            - "null"
          description: |-
            The recognized golden record type this business partner data contains.
            * `Legal Entity`: The business partner data only contains legal entity and legal address information.
            * `Site`: The business partner data contains site, site main address and its parent legal entity information.
            * `Additional Address`: The business partner data contains an additional address, (optional) parent site and parent legal entity information.
            * `Null`: No clear type determined, undecided. The golden record process will not create golden record from this business partner data.
          enum:
            - LegalEntity
            - Site
            - Address
