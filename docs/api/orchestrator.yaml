          description: Size of each page
          required: false
          schema:
            type: string
            default: "10"
            maximum: 100
            minimum: 0
      responses:
        "200":
          description: The paginated events after the given timestamp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishedTaskEventsV7Response"
        "400":
