# Runs a third Gate next to the default one and the second, acting for a third sharing member:
#
#   mvn spring-boot:run -Dspring.profiles.active=gate-3
#
# A third sharing member is what it takes to observe the confidence level of a golden record rise: the
# number of sharing members only counts towards that level from three of them on (see
# ConfidenceCriteriaDb). Why each member needs a Gate of its own is described in the gate-2 profile.
#
# The database is a separate one, created by docker/compose/dependencies/postgres-init.sh.
#
# Setting the owner BPNL makes this Gate serve that one member: it is attached to the data shared here,
# and a token naming a different company is not authorized at all.
#
# The outbound clients stay the ones from application.yml: which member a Gate acts for travels in
# the golden record task, not in the credentials the Gate itself calls Orchestrator and Pool with.

server:
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://${bpdm.datasource.host}:5432/bpdm_gate_3
bpdm:
  bpn:
    owner-bpn-l: BPNL000000000003
