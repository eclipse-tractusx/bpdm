# Values shared by every released sharing member Gate. Each member's spec.yaml passes this file first
# and its own member-N/values.yaml second, so the member file overrides and extends it. Helm replaces
# lists instead of merging them, which is why the ingress hosts and tls stay in the member files.
#
# The Gates connect to the Pool and Orchestrator the test environment operator hosts centrally.

keycloak:
  enabled: false

bpdm-gate:
  enabled: true
  startupDelaySeconds: 1
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  configMountSecurity:
    recursiveReadOnly: Disabled
  applicationConfig:
    bpdm:
      client:
        pool:
          base-url: "https://business-partners.test.tractus-x.com/pool"
        orchestrator:
          base-url: "https://business-partners.test.tractus-x.com/orchestrator"
      security:
        auth-server-url: https://centralidp.test.tractus-x.com/auth
        client-id: Cl16-CX-BPDMGate
        realm: CX-Central
        permissions:
          uploadInputPartner: write_input_partner

bpdm-pool:
  enabled: false

bpdm-orchestrator:
  enabled: false

bpdm-cleaning-service-dummy:
  enabled: false
