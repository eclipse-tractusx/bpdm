# The first sharing member Gate of the snapshot deployment: the same company and Central-IDP users as
# the released environment's bpdm-test-sharing-member, pointed at the snapshot Pool and Orchestrator.
# It mirrors that deployment so a run of the system tester exercises the same setup one release earlier,
# and shares its vault secrets the way bpdm-snapshot shares those of bpdm.

postgres:
  auth:
    password: <path:bpdm/data/int/bpdm-test-sharing-member/postgresql#postgres-password>
  customUser:
    password: <path:bpdm/data/int/bpdm-test-sharing-member/postgresql#password>

keycloak:
  enabled: false

bpdm-gate:
  enabled: true
  image:
    tag: "latest-SNAPSHOT"
    pullPolicy: Always
  startupDelaySeconds: 1
  ingress:
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
    enabled: true
    hosts:
      - host: business-partners-snapshot.int.catena-x.net
        paths:
          - path: "/companies/test-sharing-member"
            pathType: Prefix
    tls:
      - secretName: tls-secret-bpdm-snapshot-test-sharing-member-gate
        hosts:
          - business-partners-snapshot.int.catena-x.net
  livenessProbe:
    httpGet:
      path: "/companies/test-sharing-member/actuator/health/liveness"
  readinessProbe:
    httpGet:
      path: "/companies/test-sharing-member/actuator/health/readiness"
  startupProbe:
    httpGet:
      path: "/companies/test-sharing-member/actuator/health/readiness"
  configMountSecurity:
    recursiveReadOnly: Disabled
  applicationConfig:
    server:
      servlet:
        context-path: "/companies/test-sharing-member"
    bpdm:
      bpn:
        owner-bpn-l: "BPNL000000000BXT"
      client:
        pool:
          base-url: "https://business-partners-snapshot.int.catena-x.net/pool"
          registration:
            client-id: <path:bpdm/data/int/bpdm-test-sharing-member/gate/pool-client#client-id>
        orchestrator:
          base-url: "https://business-partners-snapshot.int.catena-x.net/orchestrator"
          registration:
            client-id: <path:bpdm/data/int/bpdm-test-sharing-member/gate/orchestrator-client#client-id>
      security:
        auth-server-url: https://centralidp.int.catena-x.net/auth
        client-id: Cl16-CX-BPDMGate
        realm: CX-Central
        permissions:
          uploadInputPartner: write_input_partner
  applicationSecrets:
    bpdm:
      client:
        pool:
          registration:
            client-secret: <path:bpdm/data/int/bpdm-test-sharing-member/gate/pool-client#client-secret>
        orchestrator:
          registration:
            client-secret: <path:bpdm/data/int/bpdm-test-sharing-member/gate/orchestrator-client#client-secret>

bpdm-pool:
  enabled: false

bpdm-orchestrator:
  enabled: false

bpdm-cleaning-service-dummy:
  enabled: false
