postgres:
  auth:
    password: <path:bpdm/data/int/bpdm/postgresql#postgres-password>
  customUser:
    password: <path:bpdm/data/int/bpdm/postgresql#password>

bpdm-gate:
  enabled: false

bpdm-pool:
  enabled: true
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: business-partners-snapshot.test.tractus-x.com
        paths:
          - path: /pool
            pathType: Prefix
    tls:
      - secretName: tls-secret-bpdm-pool-snapshot
        hosts:
          - business-partners-snapshot.test.tractus-x.com
  livenessProbe:
    httpGet:
      path: "/pool/actuator/health/liveness"
  readinessProbe:
    httpGet:
      path: "/pool/actuator/health/readiness"
  startupProbe:
    httpGet:
      path: "/pool/actuator/health/readiness"
  applicationConfig:
    server:
      servlet:
        context-path: "/pool"
    bpdm:
      client:
        orchestrator:
          base-url: "https://business-partners-snapshot.test.tractus-x.com/orchestrator"
          registration:
            client-id: <path:bpdm/data/int/bpdm/pool/orchestrator-client#client-id>
      security:
        auth-server-url: https://centralidp.test.tractus-x.com/auth
        client-id: Cl7-CX-BPDM
        realm: CX-Central
  applicationSecrets:
    bpdm:
      client:
        orchestrator:
          registration:
            client-secret: <path:bpdm/data/int/bpdm/pool/orchestrator-client#client-secret>

bpdm-orchestrator:
  enabled: true
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: business-partners-snapshot.test.tractus-x.com
        paths:
          - path: /orchestrator
            pathType: Prefix
    tls:
      - secretName: tls-secret-bpdm-orchestrator-snapshot
        hosts:
          - business-partners-snapshot.test.tractus-x.com
  livenessProbe:
    httpGet:
      path: "/orchestrator/actuator/health/liveness"
  readinessProbe:
    httpGet:
      path: "/orchestrator/actuator/health/readiness"
  startupProbe:
    httpGet:
      path: "/orchestrator/actuator/health/readiness"
  applicationConfig:
    server:
      servlet:
        context-path: "/orchestrator"
    bpdm:
      security:
        auth-server-url: https://centralidp.test.tractus-x.com/auth
        client-id: Cl25-CX-BPDM-Orchestrator
        realm: CX-Central

bpdm-cleaning-service-dummy:
  enabled: true
  applicationConfig:
    bpdm:
      client:
        orchestrator:
          base-url: "https://business-partners-snapshot.test.tractus-x.com/orchestrator"
          provider:
            issuer-uri: https://centralidp.test.tractus-x.com/auth/realms/CX-Central
          registration:
            client-id: <path:bpdm/data/int/bpdm/cleaning-service/orchestrator-client#client-id>
  applicationSecrets:
    bpdm:
      client:
        orchestrator:
          registration:
            client-secret: <path:bpdm/data/int/bpdm/cleaning-service/orchestrator-client#client-secret>
