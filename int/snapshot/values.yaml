# Values shared by every app of the snapshot deployment, which runs the development state from main.
# Each app's spec.yaml passes this file first and its own <app>/values.yaml second, so the app file
# overrides and extends it. Helm replaces lists instead of merging them, which is why ingress hosts
# and tls stay in the app files.
#
# core runs the Pool, Orchestrator and Cleaning Service Dummy; member-N are the sharing member Gates
# connected to them, with the same companies and vault secrets as the released sharing members.

keycloak:
  enabled: false

bpdm-gate:
  image:
    tag: "latest-SNAPSHOT"
    pullPolicy: Always
  startupDelaySeconds: 1
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  configMountSecurity:
    recursiveReadOnly: Disabled
  applicationConfig:
    bpdm:
      client:
        pool:
          base-url: "https://business-partners-snapshot.test.tractus-x.com/pool"
        orchestrator:
          base-url: "https://business-partners-snapshot.test.tractus-x.com/orchestrator"
      security:
        auth-server-url: https://centralidp.test.tractus-x.com/auth
        client-id: Cl16-CX-BPDMGate
        realm: CX-Central
        permissions:
          uploadInputPartner: write_input_partner

bpdm-pool:
  image:
    tag: "latest-SNAPSHOT"
    pullPolicy: Always
  startupDelaySeconds: 1
  configMountSecurity:
    recursiveReadOnly: Disabled

bpdm-orchestrator:
  image:
    tag: "latest-SNAPSHOT"
    pullPolicy: Always
  startupDelaySeconds: 1
  configMountSecurity:
    recursiveReadOnly: Disabled

bpdm-cleaning-service-dummy:
  image:
    tag: "latest-SNAPSHOT"
    pullPolicy: Always
  startupDelaySeconds: 1
  configMountSecurity:
    recursiveReadOnly: Disabled
