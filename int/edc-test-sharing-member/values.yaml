install:
  postgresql: true
  vault: false

participant:
  # -- Participant Id, resp. the Decentralized IDentifier (DID) of the connector
  id: "did:web:portal-backend.int.catena-x.net:api:administration:staticdata:did:BPNL000000000BXT"
  # -- BPNL Number
  bpnl: "BPNL000000000BXT"
  # -- Participant Context Id - Newly introduced id for a connector instance (needed for multitenancy)
  contextId: "d16cf5de-edf5-421c-86d6-1780f46a3c9a"

dcp:
  trustedIssuers:
    - "did:web:portal-backend.int.catena-x.net:api:administration:staticdata:did:BPNL00000003CRHK"
  sts:
    div:
      url: "https://dis-integration-service-prod.eu10.dim.cloud.sap/api/v2.0.0/iatp/catena-x-portal"
    oauth:
      token_url: "https://7d8afa41-2fa1-471c-bce6-4433de34d93a-td7lnqz3.authentication.eu10.hana.ondemand.com/oauth/token"
      client:
        id: "sb-e91ba924-e3c3-4ff5-838b-58f2eca0d4a8!b517493|ica-production-dim-prod-eu10-004-prod-dis-cloud-approuter!b174292"
        secret_alias: "wallet-client-secret"
  # - Configures the Verifiable Presentation cache
  cache:
    # -- Whether the Verifiable Presentation cache is enabled
    enabled: true
    # -- Validity of the Verifiable Presentation cache in seconds
    validity: 86400

controlplane:
  env:
    # -- The portal serves status list credentials as JSON. Since EDC 0.16 the revocation service only
    #    parses them as JSON when this accept header is exactly 'application/json'; on the default '*/*'
    #    it validates the body as a signed JWT instead and rejects every credential.
    EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: "application/json"
  endpoints:
    # -- data management api, used by internal users, can be added to an ingress and must not be internet facing
    management:
      # -- authentication key, must be attached to each 'X-Api-Key' request header
      authKey: <path:bpdm/data/int/edc-test-sharing-member/api#management-key>
  bdrs:
    server:
      url: "https://bpn-did-resolution-service.int.catena-x.net/api/directory"
  ## Ingress declaration to expose the network service.
  ingresses:
    ## Public / Internet facing Ingress
    - enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      # -- The hostname to be used to precisely map incoming traffic onto the underlying network service
      hostname: "bpdm-sharing-member-edc.int.catena-x.net"
      className: "nginx"
      # -- EDC endpoints exposed by this ingress resource
      endpoints:
        - management
        - control
        - protocol
      # -- TLS [tls class](https://kubernetes.io/docs/concepts/services-networking/ingress/#tls) applied to the ingress resource
      tls:
        # -- Enables TLS on the ingress resource
        enabled: true
        # -- If present overwrites the default secret name
        secretName: tls-secret-edc-test-sharing-member-controlplane

dataplane:
  endpoints:
    proxy:
      authKey: <path:bpdm/data/int/edc-test-sharing-member/api#proxy-key>
  ## Ingress declaration to expose the network service.
  ingresses:
    ## Public / Internet facing Ingress
    - enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      # -- The hostname to be used to precisely map incoming traffic onto the underlying network service
      hostname: "bpdm-sharing-member-edc.int.catena-x.net"
      # -- EDC endpoints exposed by this ingress resource
      endpoints:
        - public
      # -- Defines the [ingress class](https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class)  to use
      className: "nginx"
      # -- TLS [tls class](https://kubernetes.io/docs/concepts/services-networking/ingress/#tls) applied to the ingress resource
      tls:
        # -- Enables TLS on the ingress resource
        enabled: true
        # -- If present overwrites the default secret name
        secretName: tls-secret-edc-test-sharing-member-dataplane
  token:
    signer:
      privatekey_alias: "token-private-key"
    verifier:
      publickey_alias: "token-public-key"

postgresql:
  jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/edc"
  persistence:
    enabled: true
    # -- Empty takes the cluster's default class; the chart would otherwise ask for 'standard'.
    storageClass: ""
  auth:
    # -- Credentials of the superuser the chart creates the connector database with.
    password: <path:bpdm/data/int/edc-test-sharing-member/postgres#password>
  customUser:
    # -- The database and user the connector itself works with.
    database: "edc"
    name: "user"
    password: <path:bpdm/data/int/edc-test-sharing-member/postgres#password>

vault:
  hashicorp:
    url: "https://vault.core.catena-x.net"
    token: <path:bpdm/data/int/edc-test-sharing-member/vault#token>
    paths:
      secret: /v1/bpdm
      folder: "int/edc-test-sharing-member"