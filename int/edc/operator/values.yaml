participant:
  # -- Participant Id, resp. the Decentralized IDentifier (DID) of the connector
  id: "did:web:ssi-dim-wallet-stub.test.tractus-x.com:BPNL00000003CRHK"
  # -- BPNL Number
  bpnl: "BPNL00000003CRHK"
  # -- Participant Context Id - Newly introduced id for a connector instance (needed for multitenancy)
  contextId: "2d408948-b122-4d1d-b980-d7ff49e8bfe5"

dcp:
  sts:
    oauth:
      client:
        id: "BPNL00000003CRHK"

controlplane:
  endpoints:
    # -- data management api, used by internal users, can be added to an ingress and must not be internet facing
    management:
      # -- authentication key, must be attached to each 'X-Api-Key' request header
      authKey: <path:bpdm/data/int/edc-bpdm/api#management-key>
  ingresses:
    - enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hostname: "bpdm-edc.test.tractus-x.com"
      className: "nginx"
      endpoints:
        - management
        - control
        - protocol
      tls:
        enabled: true
        secretName: tls-secret-edc-bpdm-controlplane

dataplane:
  endpoints:
    proxy:
      authKey: <path:bpdm/data/int/edc-bpdm/api#proxy-key>
  ingresses:
    - enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hostname: "bpdm-edc.test.tractus-x.com"
      className: "nginx"
      endpoints:
        - public
      tls:
        enabled: true
        secretName: tls-secret-edc-bpdm-dataplane

postgresql:
  auth:
    # -- Credentials of the superuser the chart creates the connector database with.
    password: <path:bpdm/data/int/edc-bpdm/postgres#password>
  customUser:
    password: <path:bpdm/data/int/edc-bpdm/postgres#password>

vault:
  hashicorp:
    token: <path:bpdm/data/int/edc-bpdm/vault#token>
    paths:
      folder: "int/edc-bpdm"
