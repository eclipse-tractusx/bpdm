# Values shared by every EDC: the operator EDC providing the BPDM assets and the sharing members'
# consumer EDCs. Each app's spec.yaml passes this file first and its own <app>/values.yaml second, so
# the app file overrides and extends it. Helm replaces lists instead of merging them, which is why the
# ingresses stay in the app files.
#
# Every participant's identity lives in the environment's SSI DIM wallet stub. The stub creates a
# participant's DID, keys and credentials on first use: the OAuth client ID is the participant's BPNL
# and the client secret is not checked, so the vault entry behind secret_alias only has to exist.

install:
  postgresql: true
  vault: false

dcp:
  trustedIssuers:
    - "did:web:ssi-dim-wallet-stub.test.tractus-x.com:BPNL00000003CRHK"
  sts:
    div:
      url: "https://ssi-dim-wallet-stub.test.tractus-x.com/api/sts"
    oauth:
      token_url: "https://ssi-dim-wallet-stub.test.tractus-x.com/oauth/token"
      client:
        secret_alias: "wallet-client-secret"
  # - Configures the Verifiable Presentation cache
  cache:
    # -- Whether the Verifiable Presentation cache is enabled
    enabled: true
    # -- Validity of the Verifiable Presentation cache in seconds
    validity: 86400

controlplane:
  env:
    # -- The previous environment's Portal served status list credentials as JSON, which EDC 0.16 only
    #    parses when this accept header is exactly 'application/json'; on the default '*/*' it validates
    #    the body as a signed JWT instead. ASSUMPTION: the wallet stub serves them the same way.
    EDC_IAM_CREDENTIAL_REVOCATION_MIMETYPE: "application/json"
  bdrs:
    server:
      # -- STOPGAP: the wallet stub's own BPN-DID directory. The environment's BDRS
      #    (https://bdrs-server.test.tractus-x.com/api/directory) rejects the stub's Membership
      #    presentations. Switch back once it accepts them. The stub resolves any BPN, so a missing
      #    BDRS registration goes unnoticed while this is set.
      url: "https://ssi-dim-wallet-stub.test.tractus-x.com/api/v1/directory"

dataplane:
  token:
    signer:
      privatekey_alias: "token-private-key"
    verifier:
      publickey_alias: "token-public-key"

postgresql:
  jdbcUrl: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/edc"
  persistence:
    enabled: true
    # -- Empty takes the cluster's default class; the chart would otherwise ask for 'standard'.
    storageClass: ""
  customUser:
    # -- The database and user the connector itself works with.
    database: "edc"
    name: "user"

vault:
  hashicorp:
    url: "https://vault.test.tractus-x.com"
    paths:
      # -- ASSUMPTION: the new vault keeps the 'bpdm' secret engine.
      secret: /v1/bpdm
