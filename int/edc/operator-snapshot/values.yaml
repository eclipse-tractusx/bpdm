# The operator's second provider connector, which offers the snapshot Gates. Its spec.yaml passes the
# operator's values before this file, so it shares edc-bpdm's identity, vault folder and secrets,
# including the asset secrets of the subscription users. Only what has to differ per connector is
# overridden here: its own context id and host. A separate connector keeps each catalog to one offer
# set, which the standard catalog filters (type, subject, version, BPNL) could not tell apart.

participant:
  # -- Participant Context Id - Newly introduced id for a connector instance (needed for multitenancy)
  contextId: "1dad8a3f-141f-4ae2-9069-642246c4e518"

controlplane:
  ingresses:
    - enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hostname: "bpdm-snapshot-edc.test.tractus-x.com"
      className: "nginx"
      endpoints:
        - management
        - control
        - protocol
      tls:
        enabled: true
        secretName: tls-secret-edc-bpdm-snapshot-controlplane

dataplane:
  ingresses:
    - enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hostname: "bpdm-snapshot-edc.test.tractus-x.com"
      className: "nginx"
      endpoints:
        - public
      tls:
        enabled: true
        secretName: tls-secret-edc-bpdm-snapshot-dataplane
