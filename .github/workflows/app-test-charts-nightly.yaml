# Runs the chart tests once a night with the entire system-tester suite instead of the smoke subset a pull
# request gets. That scope is also the only one that deploys a second Gate, so the scenarios asserting what
# two sharing members see of the same golden record run here and nowhere else in CI.
#
# It is a deployment check on a throwaway cluster, not the release validation: that one is the manual run
# against the INT deployment, described in docs/maintainer/e2e-testing.md.

name: Perform Nightly Chart Tests

on:
  schedule:
    # Not on the hour, where scheduled workflows queue up, and after the daily scanning jobs at midnight.
    - cron: "20 2 * * *"
  workflow_dispatch:

jobs:
  full-suite:
    uses: ./.github/workflows/app-test-charts.yaml
    with:
      test_scope: full
