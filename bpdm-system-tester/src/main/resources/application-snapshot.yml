# Runs the system tester against the bpdm-snapshot deployment, which follows the development state of
# the main branch on the Catena-X association INT environment.
#
# Use this to try the suite out before validating a release candidate: the deployment runs unreleased
# code, so a failure here is as likely to be a genuine finding as a broken test.
#
# The deployment is served from business-partners-snapshot.test.tractus-x.com and authenticates against
# the Central-IDP at centralidp.test.tractus-x.com. It consists of a core (Pool, Orchestrator, Cleaning
# Service Dummy) and three sharing member Gates. The core carries no Gate of its own, and every member
# Gate claims the company of its member and rejects every other, so the operator credentials reach the
# Pool and the Orchestrator only. Each Gate needs its member's own two technical users, an input manager
# and an output consumer, both of that member's company:
#
#   SPRING_PROFILES_ACTIVE=snapshot \
#   BPDM_INT_CLIENT_ID=<operator id> BPDM_INT_CLIENT_SECRET=<operator secret> \
#   BPDM_INT_GATE_INPUT_CLIENT_ID=... BPDM_INT_GATE_INPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_OUTPUT_CLIENT_ID=... BPDM_INT_GATE_OUTPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_2_INPUT_CLIENT_ID=... BPDM_INT_GATE_2_INPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_2_OUTPUT_CLIENT_ID=... BPDM_INT_GATE_2_OUTPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_3_INPUT_CLIENT_ID=... BPDM_INT_GATE_3_INPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_3_OUTPUT_CLIENT_ID=... BPDM_INT_GATE_3_OUTPUT_CLIENT_SECRET=... \
#     java -jar bpdm-system-tester/target/bpdm-system-tester.jar \
#     --plugin json:target/cucumber-report.json
#
# The operator user is a Central-IDP technical user of the Cx-Operator company holding the Pool and
# Orchestrator permissions; see the int profile for how an unset variable surfaces.
#
# The tester reserves and resolves the golden record tasks itself, so scale the core's Cleaning Service
# Dummy down for the run. Left running, it takes the tasks first and most scenarios time out.
#
# Naming a base-url is what puts a sharing member into the run. To leave the second or third member out,
# blank its base-url - `BPDM_INT_GATE_3_BASE_URL=` takes the third one out.
#
# Everything not set here — securityEnabled, the client_credentials grant — comes from application.yml.

bpdm:
  client:
    pool:
      base-url: https://business-partners-snapshot.test.tractus-x.com/pool
      provider:
        issuer-uri: https://centralidp.test.tractus-x.com/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_CLIENT_ID}
        client-secret: ${BPDM_INT_CLIENT_SECRET}
    # The first sharing member, test-sharing-member (BPNL00000000071A).
    gate-input:
      base-url: https://business-partners-snapshot.test.tractus-x.com/companies/test-sharing-member
      provider:
        issuer-uri: https://centralidp.test.tractus-x.com/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_GATE_INPUT_CLIENT_ID}
        client-secret: ${BPDM_INT_GATE_INPUT_CLIENT_SECRET}
    # Base-url and issuer come from the gate-input client through application.yml.
    gate-output:
      registration:
        client-id: ${BPDM_INT_GATE_OUTPUT_CLIENT_ID}
        client-secret: ${BPDM_INT_GATE_OUTPUT_CLIENT_SECRET}
    # The second sharing member, test-sharing-member-2 (BPNL00000000080L), for the scenarios in which two
    # sharing members share the same golden record.
    gate-2-input:
      base-url: ${BPDM_INT_GATE_2_BASE_URL:https://business-partners-snapshot.test.tractus-x.com/companies/test-sharing-member-2}
      registration:
        client-id: ${BPDM_INT_GATE_2_INPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_2_INPUT_CLIENT_SECRET:}
    gate-2-output:
      registration:
        client-id: ${BPDM_INT_GATE_2_OUTPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_2_OUTPUT_CLIENT_SECRET:}
    # The third sharing member, test-sharing-member-3 (BPNL0000000009Z7), for the scenario in which the
    # confidence level of a golden record rises with the third member sharing it.
    gate-3-input:
      base-url: ${BPDM_INT_GATE_3_BASE_URL:https://business-partners-snapshot.test.tractus-x.com/companies/test-sharing-member-3}
      registration:
        client-id: ${BPDM_INT_GATE_3_INPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_3_INPUT_CLIENT_SECRET:}
    gate-3-output:
      registration:
        client-id: ${BPDM_INT_GATE_3_OUTPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_3_OUTPUT_CLIENT_SECRET:}
    orchestrator:
      base-url: https://business-partners-snapshot.test.tractus-x.com/orchestrator
      provider:
        issuer-uri: https://centralidp.test.tractus-x.com/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_CLIENT_ID}
        client-secret: ${BPDM_INT_CLIENT_SECRET}
