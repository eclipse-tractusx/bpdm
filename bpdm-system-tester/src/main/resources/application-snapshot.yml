# Runs the system tester against the bpdm-snapshot deployment, which follows the development state of
# the main branch on the Catena-X association INT environment.
#
#   SPRING_PROFILES_ACTIVE=snapshot BPDM_INT_CLIENT_ID=... BPDM_INT_CLIENT_SECRET=... \
#     java -jar bpdm-system-tester/target/bpdm-system-tester.jar \
#     --plugin json:target/cucumber-report.json
#
# Use this to try the suite out before validating a release candidate: the deployment runs unreleased
# code, so a failure here is as likely to be a genuine finding as a broken test.
#
# The deployment sits on the INT environment behind the same Central-IDP realm as the released one, so
# it takes the same credentials — hence the BPDM_INT_* variable names. See the int profile for what
# those credentials are and how an unset variable surfaces.
#
# Unlike the released environment, the snapshot deployment carries all three Gates a full run needs, so
# their base-urls are named here instead of being passed in. Only the two sharing members' credentials
# still have to be supplied:
#
#   SPRING_PROFILES_ACTIVE=snapshot \
#   BPDM_INT_CLIENT_ID=<operator id> BPDM_INT_CLIENT_SECRET=<operator secret> \
#   BPDM_INT_GATE_2_INPUT_CLIENT_ID=... BPDM_INT_GATE_2_INPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_2_OUTPUT_CLIENT_ID=... BPDM_INT_GATE_2_OUTPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_3_INPUT_CLIENT_ID=... BPDM_INT_GATE_3_INPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_3_OUTPUT_CLIENT_ID=... BPDM_INT_GATE_3_OUTPUT_CLIENT_SECRET=... \
#     java -jar bpdm-system-tester/target/bpdm-system-tester.jar \
#     --plugin json:target/cucumber-report.json
#
# Naming a base-url is what puts a sharing member into the run, so a run without those credentials now
# fails on their token request instead of skipping their scenarios. To go back to a smaller run, blank
# the base-url of the members to leave out — `BPDM_INT_GATE_3_BASE_URL=` takes the third one out again.
#
# Everything not set here — securityEnabled, the client_credentials grant — comes from application.yml.

bpdm:
  client:
    pool:
      base-url: https://business-partners-snapshot.int.catena-x.net/pool
      provider:
        issuer-uri: https://centralidp.int.catena-x.net/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_CLIENT_ID}
        client-secret: ${BPDM_INT_CLIENT_SECRET}
    gate-input:
      # The Gate of the snapshot deployment itself, acting as the first sharing member. It is the one Gate
      # that claims no company of its own, so the operator credentials reach it and the per-role Gate users
      # of the int profile are honoured here but normally left unset.
      base-url: https://business-partners-snapshot.int.catena-x.net/companies/test-company
      provider:
        issuer-uri: https://centralidp.int.catena-x.net/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_GATE_INPUT_CLIENT_ID:${BPDM_INT_CLIENT_ID}}
        client-secret: ${BPDM_INT_GATE_INPUT_CLIENT_SECRET:${BPDM_INT_CLIENT_SECRET}}
    # Base-url and issuer come from the gate-input client through application.yml.
    gate-output:
      registration:
        client-id: ${BPDM_INT_GATE_OUTPUT_CLIENT_ID:${BPDM_INT_CLIENT_ID}}
        client-secret: ${BPDM_INT_GATE_OUTPUT_CLIENT_SECRET:${BPDM_INT_CLIENT_SECRET}}
    # The snapshot deployment's first sharing member Gate, for the scenarios in which two sharing members
    # share the same golden record. That Gate claims the company its base-url names and rejects every other,
    # so the credentials below are that member's own technical users - the operator credentials above do not
    # reach it.
    gate-2-input:
      base-url: ${BPDM_INT_GATE_2_BASE_URL:https://business-partners-snapshot.int.catena-x.net/companies/test-sharing-member}
      registration:
        client-id: ${BPDM_INT_GATE_2_INPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_2_INPUT_CLIENT_SECRET:}
    gate-2-output:
      registration:
        client-id: ${BPDM_INT_GATE_2_OUTPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_2_OUTPUT_CLIENT_SECRET:}
    # The snapshot deployment's second sharing member Gate, for the scenario in which the confidence level of
    # a golden record rises with the third member sharing it. Same shape as the second member's, and a
    # company of its own again - all three members have to name a different one.
    gate-3-input:
      base-url: ${BPDM_INT_GATE_3_BASE_URL:https://business-partners-snapshot.int.catena-x.net/companies/test-sharing-member-2}
      registration:
        client-id: ${BPDM_INT_GATE_3_INPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_3_INPUT_CLIENT_SECRET:}
    gate-3-output:
      registration:
        client-id: ${BPDM_INT_GATE_3_OUTPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_3_OUTPUT_CLIENT_SECRET:}
    orchestrator:
      base-url: https://business-partners-snapshot.int.catena-x.net/orchestrator
      provider:
        issuer-uri: https://centralidp.int.catena-x.net/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_CLIENT_ID}
        client-secret: ${BPDM_INT_CLIENT_SECRET}
