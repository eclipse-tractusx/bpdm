# Adds the second sharing member of a local installation, whose Gate runs under the Gate's own `gate-2`
# profile (see INSTALL.md). Without it a local run acts for a single sharing member and skips the scenarios
# that need two.
#
#   SPRING_PROFILES_ACTIVE=gate-2 java -jar bpdm-system-tester/target/bpdm-system-tester.jar
#
# The profile carries the local topology only, so it does not combine with the `int` or `snapshot` profiles;
# those name a second sharing member through their own environment variables.
#
# That Gate is owned by BPNL000000000002 and rejects every other company - including the BPDM_ADMIN client
# the other clients of a local run use - so the two clients below are the second member's own.

bpdm:
  client:
    gate-2-input:
      base-url: http://localhost:8082
      registration:
        client-id: BPDM_GATE_2_INPUT_MANAGER
        client-secret: "**********"
    gate-2-output:
      registration:
        client-id: BPDM_GATE_2_OUTPUT_CONSUMER
        client-secret: "**********"
