cucumber.glue=org.eclipse.tractusx.bpdm.test.system.stepdefinations
# The JSON report plugin is intentionally NOT set here: it writes to target/ under the working
# directory, which fails when the tester runs in the CI helm-test pod (read-only root filesystem).
# Cucumber plugins are additive across config layers, so a value here could not be turned off at
# runtime. Enable the report only for the manual full E2E run by passing it on the command line:
#   java -jar bpdm-system-tester/target/bpdm-system-tester.jar --plugin json:target/cucumber-report.json
# (or via the CUCUMBER_PLUGIN environment variable).