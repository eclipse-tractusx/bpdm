# Runs the system tester against the BPDM deployment on the Catena-X association INT environment, which
# validates every release.
#
# The deployment is served from business-partners.test.tractus-x.com and authenticates against the
# Central-IDP at centralidp.test.tractus-x.com. The test environment operators host its core (Pool,
# Orchestrator, Cleaning Service Dummy, the Portal's Gate); BPDM deploys three test sharing member Gates
# on top of it. Every member Gate claims the company of its member and rejects every other, so the
# operator credentials reach the Pool and the Orchestrator only. Each Gate needs its member's own two
# technical users, an input manager and an output consumer, both of that member's company:
#
#   SPRING_PROFILES_ACTIVE=int \
#   BPDM_INT_CLIENT_ID=<operator id> BPDM_INT_CLIENT_SECRET=<operator secret> \
#   BPDM_INT_GATE_INPUT_CLIENT_ID=... BPDM_INT_GATE_INPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_OUTPUT_CLIENT_ID=... BPDM_INT_GATE_OUTPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_2_INPUT_CLIENT_ID=... BPDM_INT_GATE_2_INPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_2_OUTPUT_CLIENT_ID=... BPDM_INT_GATE_2_OUTPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_3_INPUT_CLIENT_ID=... BPDM_INT_GATE_3_INPUT_CLIENT_SECRET=... \
#   BPDM_INT_GATE_3_OUTPUT_CLIENT_ID=... BPDM_INT_GATE_3_OUTPUT_CLIENT_SECRET=... \
#     java -jar bpdm-system-tester/target/bpdm-system-tester.jar \
#     --plugin json:target/cucumber-report.json
#
# The profile has to be activated through the environment. Passing --spring.profiles.active as a
# program argument does not work: main() forwards its arguments to the Cucumber CLI, which rejects
# the unknown option, prints its usage text and runs no scenarios.
#
# The operator user is a Central-IDP technical user of the Cx-Operator company holding the Pool and
# Orchestrator permissions. None of the credentials are checked in. Leaving a variable unset does not
# fail fast — Spring's binder passes an unresolved placeholder through as a literal, so the run fails
# on the first token request with "401 invalid_client / Invalid client or Invalid client credentials"
# from Central-IDP.
#
# The tester reserves and resolves the golden record tasks itself, so the core's Cleaning Service Dummy
# has to be scaled down for the run. Left running, it takes the tasks first and most scenarios time
# out. The test environment operators host it: ask them to scale it down before the run and up again
# afterwards.
#
# Naming a base-url is what puts a sharing member into the run. To leave the second or third member out,
# blank its base-url - `BPDM_INT_GATE_3_BASE_URL=` takes the third one out.
#
# Everything not set here — securityEnabled, the client_credentials grant — comes from application.yml.

bpdm:
  client:
    pool:
      base-url: https://business-partners.test.tractus-x.com/pool
      provider:
        issuer-uri: https://centralidp.test.tractus-x.com/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_CLIENT_ID}
        client-secret: ${BPDM_INT_CLIENT_SECRET}
    # The first sharing member, test-sharing-member (BPNL00000000071A).
    gate-input:
      base-url: https://business-partners.test.tractus-x.com/companies/test-sharing-member
      provider:
        issuer-uri: https://centralidp.test.tractus-x.com/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_GATE_INPUT_CLIENT_ID}
        client-secret: ${BPDM_INT_GATE_INPUT_CLIENT_SECRET}
    # Base-url and issuer come from the gate-input client through application.yml.
    gate-output:
      registration:
        client-id: ${BPDM_INT_GATE_OUTPUT_CLIENT_ID}
        client-secret: ${BPDM_INT_GATE_OUTPUT_CLIENT_SECRET}
    # The second sharing member, test-sharing-member-2 (BPNL00000000080L), for the scenarios in which two
    # sharing members share the same golden record.
    gate-2-input:
      base-url: ${BPDM_INT_GATE_2_BASE_URL:https://business-partners.test.tractus-x.com/companies/test-sharing-member-2}
      registration:
        client-id: ${BPDM_INT_GATE_2_INPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_2_INPUT_CLIENT_SECRET:}
    gate-2-output:
      registration:
        client-id: ${BPDM_INT_GATE_2_OUTPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_2_OUTPUT_CLIENT_SECRET:}
    # The third sharing member, test-sharing-member-3 (BPNL0000000009Z7), for the scenario in which the
    # confidence level of a golden record rises with the third member sharing it.
    gate-3-input:
      base-url: ${BPDM_INT_GATE_3_BASE_URL:https://business-partners.test.tractus-x.com/companies/test-sharing-member-3}
      registration:
        client-id: ${BPDM_INT_GATE_3_INPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_3_INPUT_CLIENT_SECRET:}
    gate-3-output:
      registration:
        client-id: ${BPDM_INT_GATE_3_OUTPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_3_OUTPUT_CLIENT_SECRET:}
    orchestrator:
      base-url: https://business-partners.test.tractus-x.com/orchestrator
      provider:
        issuer-uri: https://centralidp.test.tractus-x.com/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_CLIENT_ID}
        client-secret: ${BPDM_INT_CLIENT_SECRET}
