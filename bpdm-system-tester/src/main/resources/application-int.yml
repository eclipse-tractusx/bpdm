# Runs the system tester against the BPDM deployment on the Catena-X association INT environment.
#
#   SPRING_PROFILES_ACTIVE=int BPDM_INT_CLIENT_ID=... BPDM_INT_CLIENT_SECRET=... \
#     java -jar bpdm-system-tester/target/bpdm-system-tester.jar \
#     --plugin json:target/cucumber-report.json
#
# The profile has to be activated through the environment. Passing --spring.profiles.active as a
# program argument does not work: main() forwards its arguments to the Cucumber CLI, which rejects
# the unknown option, prints its usage text and runs no scenarios.
#
# The credentials are a Central-IDP technical user of the Cx-Operator company holding the Pool, Gate
# and Orchestrator permissions; one user serves every client. They are deliberately not checked
# in. Leaving the variables unset does not fail fast — Spring's binder passes an unresolved
# placeholder through as a literal, so the run fails on the first token request with
# "401 invalid_client / Invalid client or Invalid client credentials" from Central-IDP.
#
# A sharing member's Gate is the exception: the Portal issues its technical users one role each, so the
# two Gate clients need a user each, supplied through BPDM_INT_GATE_INPUT_* and BPDM_INT_GATE_OUTPUT_*.
# Unset, both fall back to the one user above.
#
# Everything not set here — securityEnabled, the client_credentials grant — comes from application.yml.

bpdm:
  client:
    pool:
      base-url: https://business-partners.int.catena-x.net/pool
      provider:
        issuer-uri: https://centralidp.int.catena-x.net/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_CLIENT_ID}
        client-secret: ${BPDM_INT_CLIENT_SECRET}
    gate-input:
      # The Gate of the golden record core deployment. To test through a sharing member's own Gate
      # instead, point this at that member's context path, e.g. /companies/test-sharing-member.
      base-url: https://business-partners.int.catena-x.net/companies/test-company
      provider:
        issuer-uri: https://centralidp.int.catena-x.net/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_GATE_INPUT_CLIENT_ID:${BPDM_INT_CLIENT_ID}}
        client-secret: ${BPDM_INT_GATE_INPUT_CLIENT_SECRET:${BPDM_INT_CLIENT_SECRET}}
    # Base-url and issuer come from the gate-input client through application.yml.
    gate-output:
      registration:
        client-id: ${BPDM_INT_GATE_OUTPUT_CLIENT_ID:${BPDM_INT_CLIENT_ID}}
        client-secret: ${BPDM_INT_GATE_OUTPUT_CLIENT_SECRET:${BPDM_INT_CLIENT_SECRET}}
    # A second sharing member, for the scenarios in which two sharing members share the same golden record.
    # Naming its Gate is what marks this run as having one; leaving the base-url unset makes the run act for
    # a single sharing member and skip those scenarios. The two credentials are that member's own technical
    # users, and their BPNL has to differ from the first member's.
    gate-2-input:
      base-url: ${BPDM_INT_GATE_2_BASE_URL:}
      registration:
        client-id: ${BPDM_INT_GATE_2_INPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_2_INPUT_CLIENT_SECRET:}
    gate-2-output:
      registration:
        client-id: ${BPDM_INT_GATE_2_OUTPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_2_OUTPUT_CLIENT_SECRET:}
    # A third sharing member, for the scenario in which the confidence level of a golden record rises with
    # the third member sharing it. Same shape as the second member's variables.
    gate-3-input:
      base-url: ${BPDM_INT_GATE_3_BASE_URL:}
      registration:
        client-id: ${BPDM_INT_GATE_3_INPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_3_INPUT_CLIENT_SECRET:}
    gate-3-output:
      registration:
        client-id: ${BPDM_INT_GATE_3_OUTPUT_CLIENT_ID:}
        client-secret: ${BPDM_INT_GATE_3_OUTPUT_CLIENT_SECRET:}
    orchestrator:
      base-url: https://business-partners.int.catena-x.net/orchestrator
      provider:
        issuer-uri: https://centralidp.int.catena-x.net/auth/realms/CX-Central
      registration:
        client-id: ${BPDM_INT_CLIENT_ID}
        client-secret: ${BPDM_INT_CLIENT_SECRET}
