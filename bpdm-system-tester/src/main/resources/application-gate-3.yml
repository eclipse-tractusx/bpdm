# Adds the third sharing member of a local installation, whose Gate runs under the Gate's own `gate-3`
# profile (see INSTALL.md). Combine it with the `gate-2` profile - the scenarios that need three sharing
# members need the second one as well:
#
#   SPRING_PROFILES_ACTIVE=gate-2,gate-3 java -jar bpdm-system-tester/target/bpdm-system-tester.jar
#
# The profile carries the local topology only, so it does not combine with the `int` or `snapshot` profiles;
# those name further sharing members through their own environment variables.
#
# That Gate is owned by BPNL000000000003 and rejects every other company, so the two clients below are the
# third member's own.

bpdm:
  client:
    gate-3-input:
      base-url: http://localhost:8083
      registration:
        client-id: BPDM_GATE_3_INPUT_MANAGER
        client-secret: "**********"
    gate-3-output:
      registration:
        client-id: BPDM_GATE_3_OUTPUT_CONSUMER
        client-secret: "**********"
