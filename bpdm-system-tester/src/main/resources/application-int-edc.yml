# Layered on the 'int' profile: reaches the Gates over EDC data offers instead of with credentials of
# their own, the way a sharing member reaches them.

bpdm:
  client:
    # Stays direct: reads golden records, which no standardised Pool offer grants.
    pool:
      edc:
        enabled: false
    gate-input:
      base-url: https://business-partners.int.catena-x.net/companies/test-sharing-member
      edc:
        enabled: true
        consumer: &first-member-connector
          management-api-url: ${BPDM_INT_EDC_MANAGEMENT_API:https://bpdm-sharing-member-edc.int.catena-x.net/management}
          api-key: ${BPDM_INT_EDC_API_KEY}
          provider-dataspace-api-url: ${BPDM_INT_EDC_PROVIDER_DATASPACE_API:https://bpdm-edc.int.catena-x.net/api/v1/dsp/2025-1}
          provider-did: ${BPDM_INT_EDC_PROVIDER_DID:did:web:portal-backend.int.catena-x.net:api:administration:staticdata:did:BPNL00000003CRHK}
          consumer-bpnl: ${BPDM_INT_EDC_CONSUMER_BPNL:BPNL000000000BXT}
        asset: &gate-input-full
          type: https://w3id.org/catenax/taxonomy#BPDMGate
          subject: https://w3id.org/catenax/taxonomy#FullAccessGateInputForSharingMember
          version: "7"
          usage-purpose: cx.bpdm.gate.upload:1
          bpn-scoped: true
    gate-output:
      edc:
        enabled: true
        consumer: *first-member-connector
        asset: &gate-output-read
          type: https://w3id.org/catenax/taxonomy#BPDMGate
          subject: https://w3id.org/catenax/taxonomy#ReadAccessGateOutputForSharingMember
          version: "7"
          usage-purpose: cx.bpdm.gate.download:1
          bpn-scoped: true
    gate-2-input:
      base-url: ${BPDM_INT_GATE_2_BASE_URL:https://business-partners.int.catena-x.net/companies/test-sharing-member-2}
      edc:
        enabled: true
        consumer: &second-member-connector
          management-api-url: ${BPDM_INT_EDC_2_MANAGEMENT_API:https://bpdm-sharing-member-2-edc.int.catena-x.net/management}
          api-key: ${BPDM_INT_EDC_2_API_KEY}
          provider-dataspace-api-url: ${BPDM_INT_EDC_PROVIDER_DATASPACE_API:https://bpdm-edc.int.catena-x.net/api/v1/dsp/2025-1}
          provider-did: ${BPDM_INT_EDC_PROVIDER_DID:did:web:portal-backend.int.catena-x.net:api:administration:staticdata:did:BPNL00000003CRHK}
          consumer-bpnl: ${BPDM_INT_EDC_2_CONSUMER_BPNL:BPNL00000000726A}
        asset: *gate-input-full
    gate-2-output:
      edc:
        enabled: true
        consumer: *second-member-connector
        asset: *gate-output-read
    # The operator's own Gate, whose offers the providing connector consumes for it.
    gate-3-input:
      base-url: ${BPDM_INT_GATE_3_BASE_URL:https://business-partners.int.catena-x.net/companies/test-company}
      edc:
        enabled: true
        consumer: &operator-connector
          management-api-url: ${BPDM_INT_EDC_3_MANAGEMENT_API:https://bpdm-edc.int.catena-x.net/management}
          api-key: ${BPDM_INT_EDC_3_API_KEY}
          provider-dataspace-api-url: ${BPDM_INT_EDC_PROVIDER_DATASPACE_API:https://bpdm-edc.int.catena-x.net/api/v1/dsp/2025-1}
          provider-did: ${BPDM_INT_EDC_PROVIDER_DID:did:web:portal-backend.int.catena-x.net:api:administration:staticdata:did:BPNL00000003CRHK}
          consumer-bpnl: ${BPDM_INT_EDC_3_CONSUMER_BPNL:BPNL00000003CRHK}
        asset: *gate-input-full
    gate-3-output:
      edc:
        enabled: true
        consumer: *operator-connector
        asset: *gate-output-read
